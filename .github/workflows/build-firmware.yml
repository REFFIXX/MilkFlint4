name: Build GL-BE14000 firmware

on:
  workflow_dispatch:
  push:
    branches:
      - "cursor/flint4-kernel-7.3-ec1a"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build glinet_gl-be14000 (kernel 7.3.5)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang-18 llvm-18 lld-18 flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget cpio

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-firmware-${{ github.sha }}
          restore-keys: ccache-firmware-

      - name: Configure (GL-BE14000)
        run: |
          cp milkflint/diffconfig .config
          make defconfig

      - name: Build
        run: |
          . milkflint/host-env.sh
          make -j"$(nproc)" world V=s IGNORE_ERRORS='n m'

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp bin/targets/mediatek/filogic/*glinet_gl-be14000*/*.bin out/ 2>/dev/null || true
          ls -lh out/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: gl-be14000-firmware
          path: out/*
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          files: out/*.bin
          generate_release_notes: true
